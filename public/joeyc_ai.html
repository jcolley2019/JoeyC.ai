<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Lower Third - v3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow: hidden;
        }

        .obs-container {
            position: absolute;
            bottom: 80px;
            left: 80px;
            display: flex;
            flex-direction: column;
            transform: translateX(-150%);
            animation: slideIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .obs-container.fade-out {
            animation: slideOut 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            0%   { transform: translateX(-150%); opacity: 0; }
            100% { transform: translateX(0);     opacity: 1; }
        }
        @keyframes slideOut {
            0%   { transform: translateX(0);     opacity: 1; }
            100% { transform: translateX(-150%); opacity: 0; }
        }

        .lower-third {
            position: relative;
            background: #000000;
            border: 1px solid rgba(0, 100, 255, 0.25);
            border-radius: 6px;
            padding: 12px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.8),
                inset 0 0 25px rgba(0, 100, 255, 0.05);
        }

        .lower-third::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #04133d 0%, #0a3aad 45%, #1a8fff 100%);
            box-shadow: 0 0 12px rgba(0, 100, 255, 0.5);
        }

        .lower-third::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #04133d 0%, #0a3aad 45%, #1a8fff 100%);
            box-shadow: 0 0 8px rgba(0, 100, 255, 0.4);
        }

        .electricity {
            position: absolute;
            top: 0;
            left: -30%;
            width: 12%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(0, 120, 255, 0.7) 50%,
                transparent 100%);
            transform: skewX(-25deg);
            box-shadow: 0 0 25px rgba(0, 120, 255, 0.6);
            animation: scan 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 10;
        }

        @keyframes scan {
            0%   { left: -30%; opacity: 0; }
            10%  { opacity: 1; }
            40%  { left: 120%; opacity: 1; }
            50%  { opacity: 0; }
            100% { left: 120%; opacity: 0; }
        }

        .row-1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 2;
            width: 100%;
        }

        .website {
            font-family: 'Orbitron', sans-serif;
            font-size: 40px;
            font-weight: 700;
            color: #1a8fff;
            text-shadow: 0 0 15px rgba(0, 120, 255, 0.6);
            display: flex;
            align-items: center;
            line-height: 1;
        }

        .row-2 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 2;
            background: rgba(30, 30, 30, 0.5);
            padding: 6px 16px;
            border-radius: 4px;
            border: 1px solid rgba(0, 100, 255, 0.15);
            width: max-content;
        }

        .tag {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2.5px;
            color: #cbd5e1;
        }

        .tag.highlight {
            color: #1a8fff;
            text-shadow: 0 0 10px rgba(0, 120, 255, 0.6);
        }

        .sep {
            color: #0a5acc;
            font-size: 16px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 100, 255, 0.5);
        }

        .row-3 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 4px;
            z-index: 2;
            padding: 0 30px;
        }

        .social-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .social-item svg {
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.2));
        }
    </style>
</head>
<body>

<div class="obs-container" id="lowerThird">
    <div class="lower-third">
        <div class="electricity"></div>

        <div class="row-1">
            <div class="website">JoeyC.ai</div>
        </div>

        <div class="row-2">
            <span class="tag">TECH CREATOR</span>
            <span class="sep">//</span>
            <span class="tag highlight">AI ENTHUSIAST</span>
            <span class="sep">//</span>
            <span class="tag">BUILD IN PUBLIC</span>
        </div>

        <div class="row-3">
            <div class="social-item">
                <svg fill="#ffffff" viewBox="0 0 448 512" width="20" height="20">
                    <path d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a74.62,74.62,0,1,0,52.23,71.18V0l88,0a121.18,121.18,0,0,0,1.86,22.17h0A122.18,122.18,0,0,0,381,102.39a121.43,121.43,0,0,0,67,20.14Z"/>
                </svg>
                @buildaiwithjoey
            </div>
            <div class="social-item">
                <svg fill="#ff0000" viewBox="0 0 576 512" width="20" height="20">
                    <path d="M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305zm-317.51 213.508V175.185l142.739 81.205-142.739 81.201z"/>
                </svg>
                JoeyC.ai
            </div>
            <div class="social-item">
                <svg fill="url(#ig-grad)" viewBox="0 0 448 512" width="20" height="20">
                    <defs>
                        <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#fd5949" />
                            <stop offset="50%" stop-color="#d6249f" />
                            <stop offset="100%" stop-color="#285AEB" />
                        </linearGradient>
                    </defs>
                    <path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/>
                </svg>
                @gobuildai
            </div>
        </div>
    </div>
</div>

<script>
    setTimeout(() => {
        const container = document.getElementById('lowerThird');
        container.classList.add('fade-out');
    }, 16000);
</script>

</body>
</html>
